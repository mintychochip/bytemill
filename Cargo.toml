[workspace]
members = ["crates/bytemill", "crates/bytemill-wasm"]
resolver = "2"
# `build/` holds emitted example trees (`bml emit ... --out build/26_3/<lang>`); the
# rust-typed crate there is buildable in place, so keep it out of this workspace.
exclude = ["build"]

# Hard gate: a clippy finding is a compile error under `cargo clippy`, with no flags needed. The
# gate adds `-- -D warnings` so a rustc warning fails too (see README, "Clippy is a hard gate").
# `priority = -1` keeps a per-lint setting stronger than the group.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = true

# The browser bridge is size-sensitive; keep it separate from the CLI profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
