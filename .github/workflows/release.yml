# Build the `bml` CLI for every supported platform and attach the archives to
# a GitHub Release. Tag `v*` to publish; run the workflow manually to produce
# artifacts without creating a release.
#
# Archive names carry no version: the release tag is the version, so the
# `releases/latest/download/<name>` URLs are stable across releases.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Distribution binaries do not need the workspace's `debug = true` symbols.
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: bml
            archive: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: bml
            archive: tar.gz
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: bml
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bml
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: bml
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bml.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Add the target
        run: rustup target add ${{ matrix.target }} --toolchain stable

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo +stable build --release --locked --bin bml --target ${{ matrix.target }}

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/${{ matrix.binary }} check schemas/std/varint.bps

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/${{ matrix.binary }}" check schemas/std/varint.bps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          cp README.md "$stage/README.md"
          tar -czf "dist/bml-${{ matrix.target }}.tar.gz" \
            -C "$stage" "${{ matrix.binary }}" README.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/stage/${{ matrix.binary }}
          Copy-Item README.md dist/stage/README.md
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/bml-${{ matrix.target }}.zip"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: bml-${{ matrix.target }}
          path: dist/bml-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download every archive
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum bml-* > SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every archive
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--generate-notes --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            dist/bml-* dist/SHA256SUMS "${args[@]}"
